[package]
name = "ledgerly"
version = "1.0.0"
description = "Ledgerly desktop app (Windows)"
authors = ["Ledgerly"]
license = ""
edition = "2021"
rust-version = "1.80"

[lib]
name = "ledgerly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
