{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block public %}
<div class="login">
  <div class="loginbox">
    <div class="brand"><span class="brandmark">◈</span>ledgerly<span style="color:var(--brand)">.</span></div>
    <h1>Welcome back</h1>
    <p>Sign in to your private loan workspace.</p>
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <div class="field"><label for="u">Username</label>
        <input id="u" name="username" autocomplete="username" required autofocus></div>
      <div class="field"><label for="p">Password</label>
        <input id="p" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password"></div>
      <div class="field"><label for="c">Authenticator code</label>
        <input id="c" name="code" inputmode="numeric" pattern="[0-9 ]*" autocomplete="one-time-code" placeholder="6-digit code"></div>
      <button class="btn">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
