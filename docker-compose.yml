# Everything: `docker compose up -d --build`, then open http://localhost:8000
# Database only (for development): `docker compose up -d db`
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: loan_tracker
      POSTGRES_USER: loan_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan_tracker -d loan_tracker"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://loan_tracker:${POSTGRES_PASSWORD}@db:5432/loan_tracker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # put a TLS reverse proxy in front for phone access (deploy/README.md)

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://loan_tracker:${POSTGRES_PASSWORD}@db:5432/loan_tracker
    depends_on:
      app:
        condition: service_started
    command: ["python", "-m", "loan_tracker.cli", "scheduler"]

volumes:
  pgdata:
