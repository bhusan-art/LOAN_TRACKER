# Everything: `docker compose up -d --build`, then open http://localhost:<APP_PORT>
# Database only (for development): `docker compose up -d db`
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: loan_tracker
      POSTGRES_USER: loan_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan_tracker -d loan_tracker"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # password passed separately so any character in it works (@, #, :, /, %)
      DATABASE_URL: postgresql+psycopg://loan_tracker@db:5432/loan_tracker
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"   # set APP_PORT in .env if 8000 is taken
    volumes:
      - documents:/data/documents            # encrypted document files (back these up too)

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # password passed separately so any character in it works (@, #, :, /, %)
      DATABASE_URL: postgresql+psycopg://loan_tracker@db:5432/loan_tracker
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      app:
        condition: service_started
    command: ["python", "-m", "loan_tracker.cli", "scheduler"]

volumes:
  pgdata:
  documents:
