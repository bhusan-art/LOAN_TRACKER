services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: loan_tracker
      POSTGRES_USER: loan_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
