[project]
name = "loan-tracker"
version = "1.0.0"
description = "Personal loan management: exact-money ledger engine, dashboards, and reminders."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "tzdata>=2024.1",
    "cryptography>=42",          # Phase 14: AES-GCM for stored documents (owner approved)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loan_tracker*"]

[tool.setuptools.package-data]
loan_tracker = [
    "db/sql/*.sql",
    "db/migrations/*.mako",
    "web/templates/*.html",
    "web/static/*",
]
